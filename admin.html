<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المختبر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;background:#f4f7f9;color:#1c2b33;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}
h1{color:#0e7c6b;font-size:20px;margin-bottom:8px}
h3{margin:18px 0 10px;color:#0e7c6b;font-size:16px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
label{display:block;font-size:13px;margin:10px 0 4px;color:#5a6b75;font-weight:600}
input,textarea{width:100%;padding:10px 12px;border:1px solid #d8e0e5;border-radius:9px;font-family:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
button{background:#0e7c6b;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:#eef5f4;color:#0e7c6b}
button.del{background:#fdecea;color:#c0392b;padding:8px 12px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 40px;gap:6px;margin-bottom:6px}
.link-box{background:#eef5f4;padding:14px;border-radius:10px;word-break:break-all;font-size:13px;margin-top:12px;border-right:4px solid #0e7c6b;font-family:monospace}
.msg{padding:12px;border-radius:9px;margin-top:12px;font-size:14px;font-weight:600}
.ok{background:#e8f6ef;color:#1e8449}
.bad{background:#fdecea;color:#c0392b}
.hide{display:none}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:60px auto">
<h1>🔐 دخول لوحة المختبر</h1>
<label>البريد الإلكتروني</label>
<input id="email" type="email">
<label>كلمة المرور</label>
<input id="pass" type="password">
<br><br>
<button onclick="doLogin(event)" style="width:100%">دخول</button>
<div id="loginMsg"></div>
</div>
<div id="panel" class="hide">
<div class="head">
<h1>📋 لوحة إدخال النتائج</h1>
<button class="sec" onclick="doLogout()">خروج</button>
</div>
<div class="card">
<h3 style="margin-top:0">بيانات المريض</h3>
<div class="grid">
<div><label>اسم المريض *</label><input id="pname"></div>
<div><label>رقم الهاتف</label><input id="pphone" placeholder="9677xxxxxxxx"></div>
<div><label>رقم الملف</label><input id="pfile"></div>
<div><label>تاريخ الفحص</label><input id="pdate" type="date"></div>
</div>
<h3>نتائج التحاليل</h3>
<div class="row" style="color:#7b8b95;font-size:12px;font-weight:600">
<span>اسم الفحص</span><span>النتيجة</span><span>الوحدة</span><span>المعدل الطبيعي</span><span></span>
</div>
<div id="rows"></div>
<button class="sec" onclick="addRow()" style="margin-top:8px">+ إضافة فحص</button>
<label style="margin-top:18px">ملاحظات (اختياري)</label>
<textarea id="pnotes" rows="2"></textarea>
<br><br>
<button onclick="saveReport()" style="width:100%">💾 حفظ وتوليد الرابط</button>
<div id="saveMsg"></div>
<div id="result" class="hide">
<div class="link-box" id="linkBox"></div>
<br>
<a id="waBtn" target="_blank"><button>📲 إرسال واتساب</button></a>
<button class="sec" onclick="copyLink()">📋 نسخ</button>
<button class="sec" onclick="resetForm()">➕ تقرير جديد</button>
</div>
</div>
</div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://sgxvdsogckuznzabpuyq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNneHZkc29nY2t1em56YWJwdXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTk0NDUsImV4cCI6MjEwNjg3NTQ0NX0.RIF-v2Pj6L3azvi-njIYsZMijm06rMHqWAaiPWv570E';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
const SITE_BASE = location.origin + location.pathname.replace('admin.html','') + 'report.html';
let currentLink = '';

window.doLogin = async (e) => {
  const btn = e.target;
  btn.disabled = true;
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pass').value
  });
  btn.disabled = false;
  const m = document.getElementById('loginMsg');
  if (error) { m.className='msg bad'; m.textContent='❌ بيانات غير صحيحة'; return; }
  showPanel();
};

window.doLogout = async () => { await supabase.auth.signOut(); location.reload(); };

function showPanel(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('panel').classList.remove('hide');
  if (!document.getElementById('pdate').value)
    document.getElementById('pdate').value = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Aden'})).toISOString().slice(0,10);
  if (!document.querySelector('#rows .row')) addRow();
}

const { data:{ session } } = await supabase.auth.getSession();
if (session) showPanel();

window.addRow = (n='',v='',u='',r='') => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<input placeholder="Hemoglobin" value="${n}"><input placeholder="13.5" value="${v}"><input placeholder="g/dL" value="${u}"><input placeholder="12-16" value="${r}"><button class="del" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('rows').appendChild(d);
};

window.resetForm = () => {
  ['pname','pphone','pfile','pnotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rows').innerHTML = '';
  document.getElementById('result').classList.add('hide');
  document.getElementById('saveMsg').textContent = '';
  addRow();
};

window.saveReport = async () => {
  const msg = document.getElementById('saveMsg');
  const name = document.getElementById('pname').value.trim();
  if (!name) { msg.className='msg bad'; msg.textContent='⚠ اسم المريض مطلوب'; return; }
  const results = [...document.querySelectorAll('#rows .row')].map(row => {
    const i = row.querySelectorAll('input');
    return { name:i[0].value.trim(), value:i[1].value.trim(), unit:i[2].value.trim(), range:i[3].value.trim() };
  }).filter(x => x.name && x.value);
  if (!results.length) { msg.className='msg bad'; msg.textContent='⚠ أضف فحصاً واحداً على الأقل'; return; }
  msg.className='msg'; msg.textContent='جارٍ الحفظ…';
  const { data, error } = await supabase.from('reports').insert({
    patient_name: name,
    patient_phone: document.getElementById('pphone').value.trim() || null,
    file_number: document.getElementById('pfile').value.trim() || null,
    test_date: document.getElementById('pdate').value || new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Aden'})).toISOString().slice(0,10),
    results,
    notes: document.getElementById('pnotes').value.trim() || null
  }).select('token, patient_phone, patient_name').single();
  if (error) { msg.className='msg bad'; msg.textContent='❌ ' + error.message; return; }
  msg.className='msg ok'; msg.textContent='✅ تم الحفظ';
  currentLink = `${SITE_BASE}?t=${data.token}`;
  document.getElementById('linkBox').textContent = currentLink;
  document.getElementById('result').classList.remove('hide');
  const phone = (data.patient_phone||'').replace(/\D/g,'');
  const text = `🏥 مختبرات مستشفى ابن المبرزي التخصصي\n\nعزيزي ${data.patient_name}،\nنتائج فحصك جاهزة. اضغط الرابط:\n\n${currentLink}`;
  document.getElementById('waBtn').href = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
};

window.copyLink = () => navigator.clipboard.writeText(currentLink).then(()=>alert('تم النسخ'));
</script>
</body>
</html>
