<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المختبر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;background:#f4f7f9;color:#1c2b33;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}
h1{color:#0e7c6b;font-size:20px;margin-bottom:8px}
h3{margin:18px 0 10px;color:#0e7c6b;font-size:16px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
label{display:block;font-size:13px;margin:10px 0 4px;color:#5a6b75;font-weight:600}
input,textarea{width:100%;padding:10px 12px;border:1px solid #d8e0e5;border-radius:9px;font-family:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
button{background:#0e7c6b;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:#eef5f4;color:#0e7c6b}
button.del{background:#fdecea;color:#c0392b;padding:8px 12px}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr 40px;gap:6px;margin-bottom:6px}
.link-box{background:#eef5f4;padding:14px;border-radius:10px;word-break:break-all;font-size:13px;margin-top:12px;border-right:4px solid #0e7c6b;font-family:monospace}
.msg{padding:12px;border-radius:9px;margin-top:12px;font-size:14px;font-weight:600}
.ok{background:#e8f6ef;color:#1e8449}
.bad{background:#fdecea;color:#c0392b}
.hide{display:none}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}

/* قسم الإحصائيات */
.stats-box{background:linear-gradient(135deg,#0e7c6b,#25b39a);border-radius:16px;padding:24px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden}
.stats-box::before{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;background:rgba(255,255,255,.1);border-radius:50%}
.stats-title{font-size:16px;font-weight:700;margin-bottom:16px;position:relative;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;position:relative;z-index:2}
.stat-item{background:rgba(255,255,255,.15);border-radius:12px;padding:14px;text-align:center;backdrop-filter:blur(10px)}
.stat-val{font-size:26px;font-weight:900;display:block;line-height:1.2}
.stat-lbl{font-size:11px;opacity:.9;margin-top:4px}
.stats-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:#fff;text-decoration:underline;position:relative;z-index:2}
.stats-source{margin-top:16px;background:rgba(255,255,255,.1);border-radius:12px;padding:14px;position:relative;z-index:2}
.stats-source h4{font-size:13px;margin-bottom:10px;font-weight:700;opacity:.95}
.source-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.source-row:last-child{border-bottom:none}
.source-bar{height:5px;background:rgba(255,255,255,.2);border-radius:5px;margin-top:4px;overflow:hidden}
.source-fill{height:100%;background:#fff;border-radius:5px;transition:width 1s}
</style>
</head>
<body>
<div class="wrap">

<!-- شاشة الدخول -->
<div id="login" class="card" style="max-width:420px;margin:60px auto">
<h1>🔐 دخول لوحة المختبر</h1>
<label>البريد الإلكتروني</label>
<input id="email" type="email">
<label>كلمة المرور</label>
<input id="pass" type="password">
<br><br>
<button onclick="doLogin(event)" style="width:100%">دخول</button>
<div id="loginMsg"></div>
</div>

<!-- لوحة التحكم -->
<div id="panel" class="hide">

<!-- قسم إحصائيات الزوار -->
<div class="stats-box">
<div class="stats-title">
<span>📊 إحصائيات الموقع</span>
<span style="font-size:11px;opacity:.8">(مباشر من جميع المصادر)</span>
</div>
<div class="stats-grid">
<div class="stat-item"><span class="stat-val" id="vToday">—</span><span class="stat-lbl">اليوم</span></div>
<div class="stat-item"><span class="stat-val" id="vWeek">—</span><span class="stat-lbl">هذا الأسبوع</span></div>
<div class="stat-item"><span class="stat-val" id="vMonth">—</span><span class="stat-lbl">هذا الشهر</span></div>
<div class="stat-item"><span class="stat-val" id="vTotal">—</span><span class="stat-lbl">الإجمالي</span></div>
</div>
<div class="stats-source">
<h4>🔍 مصادر الزيارات</h4>
<div class="source-row"><span>📱 واتساب</span><span id="srcWa">—</span></div>
<div class="source-bar"><div class="source-fill" id="barWa" style="width:0%"></div></div>
<div class="source-row" style="margin-top:8px"><span>🔍 Google</span><span id="srcGoogle">—</span></div>
<div class="source-bar"><div class="source-fill" id="barGoogle" style="width:0%"></div></div>
<div class="source-row" style="margin-top:8px"><span>📘 فيسبوك</span><span id="srcFb">—</span></div>
<div class="source-bar"><div class="source-fill" id="barFb" style="width:0%"></div></div>
<div class="source-row" style="margin-top:8px"><span>🔗 مباشر</span><span id="srcDirect">—</span></div>
<div class="source-bar"><div class="source-fill" id="barDirect" style="width:0%"></div></div>
</div>
<a href="https://ibn-almubarzi-lab.goatcounter.com" target="_blank" class="stats-link">عرض التفاصيل الكاملة في GoatCounter ←</a>
</div>

<div class="head">
<h1>📋 لوحة إدخال النتائج</h1>
<button class="sec" onclick="doLogout()">خروج</button>
</div>

<div class="card">
<h3 style="margin-top:0">بيانات المريض</h3>
<div class="grid">
<div><label>اسم المريض *</label><input id="pname"></div>
<div><label>رقم الهاتف</label><input id="pphone" placeholder="9677xxxxxxxx"></div>
<div><label>رقم الملف</label><input id="pfile"></div>
<div><label>تاريخ الفحص</label><input id="pdate" type="date"></div>
</div>

<h3>نتائج التحاليل</h3>
<div class="row" style="color:#7b8b95;font-size:12px;font-weight:600">
<span>اسم الفحص</span><span>النتيجة</span><span>الوحدة</span><span>المعدل الطبيعي</span><span></span>
</div>
<div id="rows"></div>
<button class="sec" onclick="addRow()" style="margin-top:8px">+ إضافة فحص</button>

<label style="margin-top:18px">ملاحظات (اختياري)</label>
<textarea id="pnotes" rows="2"></textarea>

<br><br>
<button onclick="saveReport()" style="width:100%">💾 حفظ وتوليد الرابط</button>
<div id="saveMsg"></div>

<div id="result" class="hide">
<div class="link-box" id="linkBox"></div>
<br>
<a id="waBtn" target="_blank"><button>📲 إرسال واتساب</button></a>
<button class="sec" onclick="copyLink()">📋 نسخ</button>
<button class="sec" onclick="resetForm()">➕ تقرير جديد</button>
</div>
</div>
</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://sgxvdsogckuznzabpuyq.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNneHZkc29nY2t1em56YWJwdXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTk0NDUsImV4cCI6MjEwNjg3NTQ0NX0.RIF-v2Pj6L3azvi-njIYsZMijm06rMHqWAaiPWv570E';
const GOATCOUNTER_API = 'https://ibn-almubarzi-lab.goatcounter.com';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
const SITE_BASE = location.origin + location.pathname.replace('admin.html','') + 'report.html';
let currentLink = '';

function getToday(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Aden'})).toISOString().slice(0,10);
}

function addRow(n,v,u,r){
  n = n || ''; v = v || ''; u = u || ''; r = r || '';
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<input placeholder="Hemoglobin" value="'+n+'"><input placeholder="13.5" value="'+v+'"><input placeholder="g/dL" value="'+u+'"><input placeholder="12-16" value="'+r+'"><button class="del" onclick="this.parentNode.remove()">✕</button>';
  document.getElementById('rows').appendChild(d);
}

async function loadStats(){
  try {
    const res = await fetch(GOATCOUNTER_API + '/counter/TOTAL.json');
    const data = await res.json();
    const total = data.count || 0;

    document.getElementById('vToday').textContent = total > 0 ? '✓' : '0';
    document.getElementById('vWeek').textContent = total > 0 ? '✓' : '0';
    document.getElementById('vMonth').textContent = total > 0 ? '✓' : '0';
    document.getElementById('vTotal').textContent = total;

    document.getElementById('srcWa').textContent = '—';
    document.getElementById('srcGoogle').textContent = '—';
    document.getElementById('srcFb').textContent = '—';
    document.getElementById('srcDirect').textContent = '—';
  } catch(e) {
    document.getElementById('vToday').textContent = '—';
    document.getElementById('vWeek').textContent = '—';
    document.getElementById('vMonth').textContent = '—';
    document.getElementById('vTotal').textContent = '—';
  }
}

function showPanel(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('panel').classList.remove('hide');
  if (!document.getElementById('pdate').value)
    document.getElementById('pdate').value = getToday();
  if (!document.querySelector('#rows .row')) addRow();
  loadStats();
}

async function doLogin(e){
  const btn = e.target;
  btn.disabled = true;
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pass').value
  });
  btn.disabled = false;
  const m = document.getElementById('loginMsg');
  if (error) { m.className='msg bad'; m.textContent='❌ بيانات غير صحيحة'; return; }
  showPanel();
}

async function doLogout(){ await supabase.auth.signOut(); location.reload(); }

function resetForm(){
  ['pname','pphone','pfile','pnotes'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('rows').innerHTML = '';
  document.getElementById('result').classList.add('hide');
  document.getElementById('saveMsg').textContent = '';
  addRow();
}

async function saveReport(){
  const msg = document.getElementById('saveMsg');
  const name = document.getElementById('pname').value.trim();
  if (!name) { msg.className='msg bad'; msg.textContent='⚠ اسم المريض مطلوب'; return; }
  const rows = document.querySelectorAll('#rows .row');
  const results = [];
  for (let i = 0; i < rows.length; i++) {
    const inputs = rows[i].querySelectorAll('input');
    const n = inputs[0].value.trim(), v = inputs[1].value.trim();
    if (n && v) {
      results.push({ name:n, value:v, unit:inputs[2].value.trim(), range:inputs[3].value.trim() });
    }
  }
  if (!results.length) { msg.className='msg bad'; msg.textContent='⚠ أضف فحصاً واحداً على الأقل'; return; }
  msg.className='msg'; msg.textContent='جارٍ الحفظ…';
  const { data, error } = await supabase.from('reports').insert({
    patient_name: name,
    patient_phone: document.getElementById('pphone').value.trim() || null,
    file_number: document.getElementById('pfile').value.trim() || null,
    test_date: document.getElementById('pdate').value || getToday(),
    results: results,
    notes: document.getElementById('pnotes').value.trim() || null
  }).select('token, patient_phone, patient_name').single();
  if (error) { msg.className='msg bad'; msg.textContent='❌ ' + error.message; return; }
  msg.className='msg ok'; msg.textContent='✅ تم الحفظ';
  currentLink = SITE_BASE + '?t=' + data.token;
  document.getElementById('linkBox').textContent = currentLink;
  document.getElementById('result').classList.remove('hide');
  const phone = (data.patient_phone || '').replace(/\D/g,'');
  const text = '🏥 مختبرات مستشفى ابن المبرزي التخصصي\n\nعزيزي ' + data.patient_name + '،\nنتائج فحصك جاهزة. اضغط الرابط:\n\n' + currentLink;
  document.getElementById('waBtn').href = phone ? 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text) : 'https://wa.me/?text=' + encodeURIComponent(text);
}

function copyLink(){ navigator.clipboard.writeText(currentLink).then(function(){ alert('تم النسخ'); }); }

window.addRow = addRow;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.resetForm = resetForm;
window.saveReport = saveReport;
window.copyLink = copyLink;

const { data: { session } } = await supabase.auth.getSession();
if (session) showPanel();
</script>
</body>
</html>
