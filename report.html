<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>نتيجة الفحص | مختبرات ابن المبرزي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,sans-serif;background:#f4f7f9;color:#1c2b33;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 50px}
header{background:linear-gradient(135deg,#0e7c6b,#0a5c50);color:#fff;padding:24px 16px;text-align:center;border-radius:0 0 18px 18px}
header h1{font-size:19px}
header p{margin-top:6px;opacity:.9;font-size:13px}
.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.info span{display:block;font-size:12px;color:#7b8b95}
.info b{font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th{background:#eef5f4;color:#0e7c6b;text-align:right;padding:10px;font-size:12px}
td{padding:10px;border-bottom:1px solid #eef1f3}
.flag{color:#c0392b;font-weight:700}
.ok{color:#1e8449;font-weight:700}
.btn{margin-top:16px;background:#0e7c6b;color:#fff;padding:12px 26px;border-radius:10px;font-weight:700;border:none;cursor:pointer;font-size:14px}
.err{text-align:center;padding:50px 20px;color:#7b8b95}
.err b{display:block;font-size:44px;color:#c0392b;margin-bottom:10px}
.load{text-align:center;padding:60px 20px;color:#7b8b95}
.spin{width:36px;height:36px;border:3px solid #e3eeec;border-top-color:#0e7c6b;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.notes{margin-top:14px;padding:12px;background:#fff9e6;border-right:4px solid #f0b429;border-radius:8px;font-size:13px}
footer{text-align:center;font-size:12px;color:#93a3ad;margin-top:22px;line-height:1.8}
</style>
</head>
<body>
<header>
<h1>مختبرات مستشفى ابن المبرزي التخصصي</h1>
<p>تقرير نتائج الفحص الطبي</p>
</header>
<div class="wrap" id="app">
<div class="card"><div class="load"><div class="spin"></div>جارٍ تحميل النتيجة…</div></div>
</div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL_S='https://sgxvdsogckuznzabpuyq.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNneHZkc29nY2t1em56YWJwdXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTk0NDUsImV4cCI6MjEwNjg3NTQ0NX0.RIF-v2Pj6L3azvi-njIYsZMijm06rMHqWAaiPWv570E';
const sb=createClient(URL_S,KEY);
const app=document.getElementById('app');
const token=new URLSearchParams(location.search).get('t');
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function err(m){app.innerHTML=`<div class="card"><div class="err"><b>!</b>${esc(m)}</div></div>`;}
function out(v,r){
const n=parseFloat(v);if(isNaN(n)||!r)return false;
const s=String(r).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
let m;
if(m=s.match(/^\s*([\d.]+)\s*[-–]\s*([\d.]+)/))return n<+m[1]||n>+m[2];
if(m=s.match(/^\s*<\s*([\d.]+)/))return n>=+m[1];
if(m=s.match(/^\s*>\s*([\d.]+)/))return n<=+m[1];
return false;}
if(!token||!UUID.test(token)){err('رابط غير صالح. تأكد من نسخ الرابط كاملاً.');}
else{
const{data,error}=await sb.rpc('get_report',{p_token:token});
if(error){err('خطأ في الاتصال. حاول لاحقاً.');}
else if(!data||data.length===0){err('لم يتم العثور على نتيجة لهذا الرابط.');}
else{
const r=data[0];
const rows=(r.results||[]).map(x=>{
const f=out(x.value,x.range);
return`<tr><td>${esc(x.name)}</td><td><b class="${f?'flag':'ok'}">${esc(x.value)}${f?' ⚠':''}</b></td><td>${esc(x.unit||'')}</td><td>${esc(x.range||'')}</td></tr>`;}).join('');
app.innerHTML=`
<div class="card"><div class="info">
<div><span>اسم المريض</span><b>${esc(r.patient_name)}</b></div>
<div><span>رقم الملف</span><b>${esc(r.file_number||'—')}</b></div>
<div><span>تاريخ الفحص</span><b>${esc(r.test_date)}</b></div>
</div></div>
<div class="card">
<h3 style="color:#0e7c6b;font-size:15px">نتائج التحاليل</h3>
<table>
<thead><tr><th>الفحص</th><th>النتيجة</th><th>الوحدة</th><th>المعدل الطبيعي</th></tr></thead>
<tbody>${rows}</tbody>
</table>
${r.notes?`<div class="notes"><b>ملاحظات:</b> ${esc(r.notes)}</div>`:''}
<button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
</div>
<footer>هذا التقرير صادر إلكترونياً من مختبرات مستشفى ابن المبرزي التخصصي<br>يُرجى مراجعة الطبيب المختص لتفسير النتائج</footer>`;
}}
</script>
</body>
</html>
